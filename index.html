<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirar Dados</title>
<style>
  :root {
    --bg1: #1a1147;
    --bg2: #3b1d6e;
    --accent: #ffd447;
    --die: #fdfdfd;
    --pip: #2a2140;
    --double: #58e08a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 50%, var(--bg2), var(--bg1));
    color: #fff;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    padding: 1rem;
    text-align: center;
    user-select: none;
    overflow-x: hidden;
  }

  /* Bloque de resultado (se usa arriba girado y abajo normal) */
  .result {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .1rem;
    min-height: 4.5rem;
    justify-content: center;
    flex: 0 0 auto;
  }
  .result.flip { transform: rotate(180deg); } /* para el jugador de enfrente */
  .result .label {
    font-size: clamp(.85rem, 3.2vw, 1.1rem);
    opacity: .85;
    letter-spacing: .5px;
  }
  .numword {
    font-size: clamp(1.6rem, 8vw, 3rem);
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .bignum {
    font-size: clamp(3.5rem, 16vw, 7rem);
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .bignum.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .breakdown {
    font-size: clamp(.9rem, 3.6vw, 1.25rem);
    opacity: .9;
    min-height: 1.3em;
  }
  .double-badge {
    display: inline-block;
    margin-top: .2rem;
    padding: .2rem .8rem;
    border-radius: 999px;
    background: var(--double);
    color: #08331c;
    font-weight: 800;
    font-size: clamp(.9rem, 3.4vw, 1.1rem);
    box-shadow: 0 6px 18px rgba(88,224,138,.45);
    animation: pop .45s cubic-bezier(.2,1.4,.4,1);
  }

  /* Zona central: dados + botón grande */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    flex: 1 1 auto;
    justify-content: center;
  }
  .dice {
    display: flex;
    gap: clamp(1.2rem, 6vw, 3rem);
    perspective: 800px;
  }
  .die {
    width: clamp(70px, 20vw, 120px);
    height: clamp(70px, 20vw, 120px);
    background: linear-gradient(145deg, #ffffff, #dfe1ea);
    border-radius: 22%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 14%;
    gap: 6%;
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 -6px 12px rgba(0,0,0,.12);
  }
  .die.rolling { animation: shake .5s ease infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-14deg) translateY(-8px); }
    50% { transform: rotate(10deg) translateY(4px); }
    75% { transform: rotate(-6deg) translateY(-4px); }
  }
  .pip {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a4f7a, var(--pip));
    align-self: center;
    justify-self: center;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.4);
  }
  .p1 { grid-area: 1 / 1; } .p2 { grid-area: 1 / 2; } .p3 { grid-area: 1 / 3; }
  .p4 { grid-area: 2 / 1; } .p5 { grid-area: 2 / 2; } .p6 { grid-area: 2 / 3; }
  .p7 { grid-area: 3 / 1; } .p8 { grid-area: 3 / 2; } .p9 { grid-area: 3 / 3; }

  /* Botón grande y centrado */
  .roll-btn {
    font: inherit;
    font-size: clamp(1.8rem, 8vw, 3rem);
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--pip);
    background: linear-gradient(180deg, #ffe27a, var(--accent));
    border: none;
    border-radius: 999px;
    padding: clamp(1rem, 4vw, 1.6rem) clamp(2.5rem, 12vw, 5rem);
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(255,212,71,.5);
    transition: transform .1s ease, box-shadow .1s ease;
    text-transform: uppercase;
  }
  .roll-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 16px 36px rgba(255,212,71,.6); }
  .roll-btn:active { transform: translateY(2px) scale(.97); }
  .roll-btn:disabled { opacity: .6; cursor: default; transform: none; }

  .mute {
    position: fixed;
    top: .6rem;
    right: .6rem;
    background: rgba(255,255,255,.12);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 3rem;
    height: 3rem;
    font-size: 1.5rem;
    cursor: pointer;
    opacity: .85;
    z-index: 20;
  }
  .mute:hover { opacity: 1; }

  /* ===== Cartel de CÁRCEL con luces de policía ===== */
  .jail {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 1rem;
    text-align: center;
    animation: policeFlash .5s steps(1) infinite;
  }
  .jail.show { display: flex; }
  /* fondo que alterna rojo/azul como sirena */
  @keyframes policeFlash {
    0%   { background: #c0071a; box-shadow: inset 0 0 220px 60px rgba(255,0,0,.7); }
    50%  { background: #0a2ec0; box-shadow: inset 0 0 220px 60px rgba(0,40,255,.7); }
    100% { background: #c0071a; box-shadow: inset 0 0 220px 60px rgba(255,0,0,.7); }
  }
  /* barras de luces arriba y abajo */
  .lights {
    width: 100%;
    height: 14px;
    border-radius: 999px;
    animation: lightBar .3s steps(1) infinite;
  }
  @keyframes lightBar {
    0%   { background: linear-gradient(90deg, #ff2b2b 0 33%, #fff 33% 66%, #2b5bff 66% 100%); }
    50%  { background: linear-gradient(90deg, #2b5bff 0 33%, #fff 33% 66%, #ff2b2b 66% 100%); }
    100% { background: linear-gradient(90deg, #ff2b2b 0 33%, #fff 33% 66%, #2b5bff 66% 100%); }
  }
  .jail-msg {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .4rem;
  }
  .jail-msg.flip { transform: rotate(180deg); }
  .jail-emoji { font-size: clamp(3rem, 14vw, 6rem); line-height: 1; }
  .jail-title {
    font-size: clamp(2rem, 10vw, 4rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 12px rgba(0,0,0,.6), 0 4px 0 #7a0010;
    animation: jailPulse .5s ease-in-out infinite alternate;
  }
  .jail-sub {
    font-size: clamp(1rem, 4.5vw, 1.6rem);
    font-weight: 700;
    color: #ffe;
  }
  @keyframes jailPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }
  .jail-close {
    font: inherit;
    font-size: clamp(1.1rem, 4.5vw, 1.5rem);
    font-weight: 800;
    color: #c0071a;
    background: #fff;
    border: none;
    border-radius: 999px;
    padding: .7rem 2rem;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.4);
    z-index: 31;
  }
  .jail-close:active { transform: scale(.96); }
</style>
</head>
<body>
  <button id="muteBtn" class="mute" title="Silenciar / activar sonido" aria-label="Silenciar">🔊</button>

  <!-- Resultado para el jugador de ENFRENTE (girado 180°) -->
  <div class="result flip" id="resultTop">
    <span class="label" id="labelTop">Tirá los dados</span>
    <span class="numword" id="numwordTop"></span>
    <span class="bignum" id="bignumTop"></span>
    <span class="breakdown" id="breakdownTop"></span>
  </div>

  <!-- Centro: dados + botón grande -->
  <div class="center">
    <div class="dice" id="dice">
      <div class="die" id="die1"></div>
      <div class="die" id="die2"></div>
    </div>
    <button id="rollBtn" class="roll-btn">🎲 Tirar</button>
  </div>

  <!-- Resultado para TU lado (normal) -->
  <div class="result" id="resultBottom">
    <span class="label" id="labelBottom">Tirá los dados</span>
    <span class="numword" id="numwordBottom"></span>
    <span class="bignum" id="bignumBottom"></span>
    <span class="breakdown" id="breakdownBottom"></span>
  </div>

  <!-- Cartel de CÁRCEL (3 dobles seguidos) -->
  <div class="jail" id="jail">
    <div class="lights"></div>

    <!-- mensaje para el jugador de enfrente (girado) -->
    <div class="jail-msg flip">
      <span class="jail-emoji">🚨🚔👮</span>
      <span class="jail-title">¡Va a la cárcel!</span>
      <span class="jail-sub">3 dobles seguidos</span>
    </div>

    <button class="jail-close" id="jailClose">Entendido, a la cárcel 🚔</button>

    <!-- mensaje para tu lado (normal) -->
    <div class="jail-msg">
      <span class="jail-emoji">🚨🚔👮</span>
      <span class="jail-title">¡Va a la cárcel!</span>
      <span class="jail-sub">3 dobles seguidos</span>
    </div>

    <div class="lights"></div>
  </div>

<script>
  const FACES = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9],
  };

  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  const btn = document.getElementById('rollBtn');
  const muteBtn = document.getElementById('muteBtn');

  // Los dos bloques de resultado (arriba girado, abajo normal)
  const labels = [document.getElementById('labelTop'), document.getElementById('labelBottom')];
  const numwords = [document.getElementById('numwordTop'), document.getElementById('numwordBottom')];
  const bignums = [document.getElementById('bignumTop'), document.getElementById('bignumBottom')];
  const breakdowns = [document.getElementById('breakdownTop'), document.getElementById('breakdownBottom')];

  // Palabra de cada resultado posible (suma de 2 a 12)
  const WORDS = {
    2: 'DOS', 3: 'TRES', 4: 'CUATRO', 5: 'CINCO', 6: 'SEIS', 7: 'SIETE',
    8: 'OCHO', 9: 'NUEVE', 10: 'DIEZ', 11: 'ONCE', 12: 'DOCE'
  };

  // ===== Audio (Web Audio API, sin archivos externos) =====
  let audioCtx = null, master = null, compressor = null, muted = false;

  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = 3.0; // bien fuerte
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 20;
      compressor.ratio.value = 12;
      compressor.attack.value = 0.002;
      compressor.release.value = 0.2;
      master.connect(compressor).connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, start, dur, type = 'sine', gain = 0.9) {
    const ctx = getCtx();
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playShake(duration = 0.8) {
    if (muted) return;
    const ctx = getCtx();
    for (let i = 0; i < 20; i++) {
      const t0 = ctx.currentTime + Math.random() * duration;
      const len = 0.035;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < data.length; j++) {
        data[j] = (Math.random() * 2 - 1) * (1 - j / data.length);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const g = ctx.createGain();
      g.gain.value = 0.8 + Math.random() * 0.5;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800 + Math.random() * 2200;
      src.connect(filter).connect(g).connect(master);
      src.start(t0);
    }
  }

  function playResult() {
    if (muted) return;
    tone(523.25, 0, 0.22, 'sawtooth', 0.85);
    tone(783.99, 0.10, 0.28, 'sawtooth', 0.8);
    tone(261.63, 0, 0.3, 'square', 0.5);
  }

  function playDouble() {
    if (muted) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      tone(f, i * 0.12, 0.35, 'sawtooth', 0.9);
      tone(f / 2, i * 0.12, 0.35, 'square', 0.45);
    });
    tone(1318.5, 0.5, 0.5, 'square', 0.8);
    tone(1567.98, 0.5, 0.5, 'sawtooth', 0.7);
  }

  // Sirena de policía (fuerte) para el cartel de cárcel
  function playSiren(dur = 3.0) {
    if (muted) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sawtooth';
    g.gain.value = 0.9;
    osc.connect(g).connect(master);
    const t0 = ctx.currentTime;
    let t = t0;
    osc.frequency.setValueAtTime(700, t);
    const step = 0.35;
    for (let i = 0; t < t0 + dur; i++) {
      osc.frequency.linearRampToValueAtTime(i % 2 === 0 ? 1300 : 700, t + step);
      t += step;
    }
    osc.start(t0);
    osc.stop(t + 0.05);
  }

  // ===== Dados =====
  function render(dieEl, value) {
    dieEl.innerHTML = '';
    for (const pos of FACES[value]) {
      const pip = document.createElement('div');
      pip.className = 'pip p' + pos;
      dieEl.appendChild(pip);
    }
  }

  function randomDie() { return Math.floor(Math.random() * 6) + 1; }

  // Contador de dobles seguidos y cartel de cárcel
  let doblesSeguidos = 0;
  // MODO PRUEBA: las primeras 3 tiradas salen dobles a propósito para probar
  // el cartel de cárcel. Pasa UNA SOLA VEZ por navegador (se recuerda con
  // localStorage), así no se repite en cada recarga. Después, todo al azar.
  let tiradasForzadas = localStorage.getItem('pruebaCarcelHecha') ? 0 : 3;
  const jail = document.getElementById('jail');
  const jailClose = document.getElementById('jailClose');

  function showJail() {
    jail.classList.add('show');
    playSiren(3.0);
  }
  jailClose.addEventListener('click', () => jail.classList.remove('show'));

  function setBoth(arr, htmlOrText, isHtml) {
    arr.forEach(el => { if (isHtml) el.innerHTML = htmlOrText; else el.textContent = htmlOrText; });
  }

  function showBig(n) {
    bignums.forEach(el => {
      el.textContent = n;
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    });
  }

  function roll() {
    getCtx();
    btn.disabled = true;
    setBoth(labels, 'Tirando...', false);
    setBoth(numwords, '', false);
    setBoth(bignums, '', false);
    setBoth(breakdowns, '', true);
    die1.classList.add('rolling');
    die2.classList.add('rolling');

    playShake(0.8);

    const spin = setInterval(() => {
      render(die1, randomDie());
      render(die2, randomDie());
    }, 80);

    setTimeout(() => {
      clearInterval(spin);
      let v1, v2;
      if (tiradasForzadas > 0) {
        v1 = v2 = randomDie(); // fuerza doble para probar la cárcel
        tiradasForzadas--;
        if (tiradasForzadas === 0) localStorage.setItem('pruebaCarcelHecha', '1');
      } else {
        v1 = randomDie();
        v2 = randomDie();
      }
      render(die1, v1);
      render(die2, v2);
      die1.classList.remove('rolling');
      die2.classList.remove('rolling');

      const suma = v1 + v2;
      const esDoble = v1 === v2;

      // Cuenta de dobles seguidos
      if (esDoble) doblesSeguidos++; else doblesSeguidos = 0;

      setBoth(labels, esDoble ? '¡DOBLES!' : 'Resultado', false);
      setBoth(numwords, WORDS[suma], false);
      showBig(suma);

      let extra = '';
      if (esDoble) {
        extra = `<br><span class="double-badge">🎉 Doble ${v1} · ${doblesSeguidos}º seguido</span>`;
      }
      setBoth(breakdowns, `${v1} + ${v2}` + extra, true);

      if (doblesSeguidos >= 3) {
        // Tercer doble seguido: ¡a la cárcel!
        showJail();
        doblesSeguidos = 0;
      } else if (esDoble) {
        playDouble();
      } else {
        playResult();
      }
      btn.disabled = false;
    }, 800);
  }

  btn.addEventListener('click', roll);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  render(die1, 1);
  render(die2, 1);

  // ===== Auto-actualización =====
  // Cada 45s revisa si se publicó una versión nueva de la app y, solo si
  // cambió, recarga la página. No recarga si estás tirando o con el cartel
  // de cárcel abierto, para no interrumpir la partida.
  let baseHash = null;

  function quickHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return h;
  }

  async function checkForUpdate() {
    // No interrumpir mientras se juega
    if (btn.disabled || jail.classList.contains('show')) return;
    try {
      const res = await fetch('index.html?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      const h = quickHash(text);
      if (baseHash === null) { baseHash = h; return; }   // primera vez: guarda referencia
      if (h !== baseHash) {
        // Hay versión nueva publicada -> recargar
        setBoth(labels, 'Actualizando app...', false);
        setTimeout(() => location.reload(true), 700);
      }
    } catch (e) { /* sin conexión: reintenta en el próximo ciclo */ }
  }

  checkForUpdate();                 // establece la referencia al abrir
  setInterval(checkForUpdate, 45000);
</script>
</body>
</html>

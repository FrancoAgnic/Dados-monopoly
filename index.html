<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirar Dados</title>
<style>
  :root {
    --bg1: #1a1147;
    --bg2: #3b1d6e;
    --accent: #ffd447;
    --die: #fdfdfd;
    --pip: #2a2140;
    --double: #58e08a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    color: #fff;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    padding: 2rem 1rem;
    text-align: center;
    user-select: none;
    overflow-x: hidden;
  }
  h1 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    letter-spacing: 1px;
    text-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  h1 span { color: var(--accent); }

  .dice {
    display: flex;
    gap: clamp(1.2rem, 5vw, 3rem);
    perspective: 800px;
  }
  .die {
    width: clamp(80px, 22vw, 130px);
    height: clamp(80px, 22vw, 130px);
    background: linear-gradient(145deg, #ffffff, #dfe1ea);
    border-radius: 22%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 14%;
    gap: 6%;
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 -6px 12px rgba(0,0,0,.12);
  }
  .die.rolling { animation: shake .5s ease infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-14deg) translateY(-8px); }
    50% { transform: rotate(10deg) translateY(4px); }
    75% { transform: rotate(-6deg) translateY(-4px); }
  }
  .pip {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a4f7a, var(--pip));
    align-self: center;
    justify-self: center;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.4);
  }
  /* posiciones de puntos por celda de grilla 3x3 */
  .p1 { grid-area: 1 / 1; } .p2 { grid-area: 1 / 2; } .p3 { grid-area: 1 / 3; }
  .p4 { grid-area: 2 / 1; } .p5 { grid-area: 2 / 2; } .p6 { grid-area: 2 / 3; }
  .p7 { grid-area: 3 / 1; } .p8 { grid-area: 3 / 2; } .p9 { grid-area: 3 / 3; }

  /* Resultado en número grande */
  .result {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .2rem;
    min-height: 1.3em;
  }
  .result .label {
    font-size: clamp(.9rem, 3.5vw, 1.15rem);
    opacity: .85;
    letter-spacing: .5px;
  }
  .bignum {
    font-size: clamp(4.5rem, 22vw, 9rem);
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .bignum.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop {
    0% { transform: scale(.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .breakdown {
    font-size: clamp(1rem, 4vw, 1.35rem);
    opacity: .9;
    min-height: 1.4em;
  }
  .double-badge {
    display: inline-block;
    margin-top: .3rem;
    padding: .25rem .9rem;
    border-radius: 999px;
    background: var(--double);
    color: #08331c;
    font-weight: 800;
    font-size: clamp(.95rem, 3.8vw, 1.2rem);
    box-shadow: 0 6px 18px rgba(88,224,138,.45);
    animation: pop .45s cubic-bezier(.2,1.4,.4,1);
  }

  button {
    font: inherit;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    font-weight: 700;
    color: var(--pip);
    background: linear-gradient(180deg, #ffe27a, var(--accent));
    border: none;
    border-radius: 999px;
    padding: .8rem 2.4rem;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,212,71,.4);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255,212,71,.5); }
  button:active { transform: translateY(1px) scale(.97); }
  button:disabled { opacity: .6; cursor: default; transform: none; }

  .mute {
    background: transparent;
    color: #fff;
    box-shadow: none;
    font-size: 1.5rem;
    padding: .3rem .6rem;
    opacity: .8;
  }
  .mute:hover { transform: none; box-shadow: none; opacity: 1; }
  .controls { display: flex; align-items: center; gap: .8rem; }
</style>
</head>
<body>
  <h1>Tirar <span>Dados</span> 🎲</h1>

  <div class="dice" id="dice">
    <div class="die" id="die1"></div>
    <div class="die" id="die2"></div>
  </div>

  <div class="result" id="result">
    <span class="label" id="resultLabel">Presiona el botón para tirar</span>
    <span class="bignum" id="bignum"></span>
    <span class="breakdown" id="breakdown"></span>
  </div>

  <div class="controls">
    <button id="rollBtn">¡Tirar!</button>
    <button id="muteBtn" class="mute" title="Silenciar / activar sonido" aria-label="Silenciar">🔊</button>
  </div>

<script>
  // ===== Puntos de cada cara (grilla 3x3) =====
  const FACES = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9],
  };

  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  const resultLabel = document.getElementById('resultLabel');
  const bignum = document.getElementById('bignum');
  const breakdown = document.getElementById('breakdown');
  const btn = document.getElementById('rollBtn');
  const muteBtn = document.getElementById('muteBtn');

  // ===== Audio (Web Audio API, sin archivos externos) =====
  let audioCtx = null;
  let master = null;      // volumen maestro
  let compressor = null;  // evita distorsión al subir fuerte
  let muted = false;

  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // Cadena: sonidos -> master (volumen alto) -> compresor -> parlantes
      master = audioCtx.createGain();
      master.gain.value = 3.0; // BIEN fuerte
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 20;
      compressor.ratio.value = 12;
      compressor.attack.value = 0.002;
      compressor.release.value = 0.2;
      master.connect(compressor).connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Un tono simple con envolvente (sale por el master fuerte)
  function tone(freq, start, dur, type = 'sine', gain = 0.9) {
    const ctx = getCtx();
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  // Traqueteo de dados: ráfagas cortas de ruido (fuertes)
  function playShake(duration = 0.8) {
    if (muted) return;
    const ctx = getCtx();
    const clicks = 20;
    for (let i = 0; i < clicks; i++) {
      const t0 = ctx.currentTime + Math.random() * duration;
      const len = 0.035;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < data.length; j++) {
        data[j] = (Math.random() * 2 - 1) * (1 - j / data.length); // ruido que decae
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const g = ctx.createGain();
      g.gain.value = 0.8 + Math.random() * 0.5; // mucho más fuerte
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800 + Math.random() * 2200;
      src.connect(filter).connect(g).connect(master);
      src.start(t0);
    }
  }

  // Sonido al mostrar el resultado normal (fuerte y con cuerpo)
  function playResult() {
    if (muted) return;
    tone(523.25, 0, 0.22, 'sawtooth', 0.85); // Do
    tone(783.99, 0.10, 0.28, 'sawtooth', 0.8); // Sol
    tone(261.63, 0, 0.3, 'square', 0.5); // bajo que le da golpe
  }

  // Sonido especial de dobles: fanfarria ascendente bien fuerte
  function playDouble() {
    if (muted) return;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // Do - Mi - Sol - Do agudo
    notes.forEach((f, i) => {
      tone(f, i * 0.12, 0.35, 'sawtooth', 0.9);
      tone(f / 2, i * 0.12, 0.35, 'square', 0.45); // refuerzo grave
    });
    // brillo final
    tone(1318.5, 0.5, 0.5, 'square', 0.8);
    tone(1567.98, 0.5, 0.5, 'sawtooth', 0.7);
  }

  // ===== Lógica de dados =====
  function render(dieEl, value) {
    dieEl.innerHTML = '';
    for (const pos of FACES[value]) {
      const pip = document.createElement('div');
      pip.className = 'pip p' + pos;
      dieEl.appendChild(pip);
    }
  }

  function randomDie() {
    return Math.floor(Math.random() * 6) + 1; // 1..6
  }

  function showBig(n) {
    bignum.textContent = n;
    bignum.classList.remove('pop');
    void bignum.offsetWidth; // reinicia la animación
    bignum.classList.add('pop');
  }

  function roll() {
    getCtx(); // "desbloquea" el audio con el gesto del usuario
    btn.disabled = true;
    resultLabel.textContent = 'Tirando...';
    bignum.textContent = '';
    breakdown.innerHTML = '';
    die1.classList.add('rolling');
    die2.classList.add('rolling');

    playShake(0.8);

    const spin = setInterval(() => {
      render(die1, randomDie());
      render(die2, randomDie());
    }, 80);

    setTimeout(() => {
      clearInterval(spin);
      const v1 = randomDie();
      const v2 = randomDie();
      render(die1, v1);
      render(die2, v2);
      die1.classList.remove('rolling');
      die2.classList.remove('rolling');

      const suma = v1 + v2;
      const esDoble = v1 === v2;

      resultLabel.textContent = esDoble ? '¡DOBLES!' : 'Resultado';
      showBig(suma);
      breakdown.innerHTML = `${v1} + ${v2}` +
        (esDoble ? `<br><span class="double-badge">🎉 Doble ${v1} · ¡tirá de nuevo!</span>` : '');

      if (esDoble) playDouble();
      else playResult();

      btn.disabled = false;
    }, 800);
  }

  btn.addEventListener('click', roll);

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
  });

  // Estado inicial
  render(die1, 1);
  render(die2, 1);
</script>
</body>
</html>
